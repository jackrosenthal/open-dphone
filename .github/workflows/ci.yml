# Builds the firmware image of every model with Nix and runs the flake's
# checks.  The work is split into jobs that run at once, each building some
# of the flake's outputs (.github/actions/nix-build):
#
#   kernel, web, apps, brush, coreutils, sed, workspace,
#   checks-deps                                           (nothing before them)
#   rootfs, tests, clippy                                 (from those)
#   one image per model, jffs2-mount                      (from rootfs)
#   checks                                                (`nix flake check`)
#   cache                                                 (for the next run)
#
# Each image is uploaded as a workflow artifact, `firmware-<model>`.  A
# pushed tag vX.Y.Z (the workspace version in Cargo.toml) also publishes the
# seven images as a GitHub Release, with SHA256SUMS, and then publishes
# dphone-app-sdk to crates.io (trusted publishing).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request replaces the run in progress; a
# tag's run (a release) is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The pieces that depend on nothing else in the repository.  The Rust
  # jobs link for the phone with rust-lld; only the kernel uses the ARM C
  # toolchain, which comes from the public binary cache.
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernel
            installables: .#kernel
          - name: web
            installables: .#web
          - name: apps
            installables: .#apps
          - name: brush
            installables: .#brush
          - name: coreutils
            installables: .#coreutils
          - name: sed
            installables: .#sed
          # The image tool, and the dependencies of the firmware binary;
          # the binary itself embeds the web frontend, so it is built in
          # `rootfs`.
          - name: workspace
            installables: .#dphone-image .#dphone.cargoArtifacts
          # The dependencies of the tests and of clippy.
          - name: checks-deps
            installables: .#checks.x86_64-linux.tests.cargoArtifacts
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: ${{ matrix.name }}
          installables: ${{ matrix.installables }}
          cache: true

  # The firmware binary and the root file system, which all models share.
  # This job downloads the vendor's two stock images for the DSP firmware;
  # the cache keeps what it takes from them.
  rootfs:
    name: rootfs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: rootfs
          installables: .#rootfs .#rootfs-tree .#dphone .#dphone-image .#kernel
          cache: true
          stores: nix-new-*
          results: true

  model:
    name: ${{ matrix.model }}
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [d40, d45, d50, d60, d62, d65, d70]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          installables: .#eff-${{ matrix.model }}
          stores: nix-results-rootfs

      # The out-link is the image itself, under its own name in the store.
      - name: Copy the image out of the store
        run: |
          image="$(readlink "$RUNNER_TEMP/nix/result")"
          mkdir dist
          cp "$image" "dist/${image#/nix/store/*-}"
          ls -l dist

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.model }}
          path: dist
          if-no-files-found: error

  # The tests download the vendor's stock images too, and build Asterisk
  # with res_dpma_rs; the cache keeps both.
  tests:
    name: tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: tests
          installables: .#checks.x86_64-linux.tests
          cache: true
          stores: nix-new-*

  clippy:
    name: clippy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: clippy
          installables: .#checks.x86_64-linux.clippy
          cache: true
          stores: nix-new-*

  # Runs in a virtual machine, with the runner's /dev/kvm.
  jffs2-mount:
    name: jffs2-mount
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: jffs2-mount
          installables: .#checks.x86_64-linux.jffs2-mount
          stores: nix-results-rootfs

  # Every check the flake defines.  The jobs above have built them all, so
  # this builds nothing unless a check has been added without a job.
  checks:
    name: checks
    needs: [rootfs, tests, clippy, jffs2-mount]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          cache: true
          stores: nix-new-*

      - run: nix flake check --print-build-logs

  # What the jobs of this run added, joined to the cache that they started
  # from, for the next run.  It runs after failures too, so that what did
  # build is not built again.  The cache holds what the build of the images
  # and the checks needs and the public binary cache does not have; that
  # includes the vendor's stock images, so only a run that starts with no
  # cache needs the vendor's server.
  cache:
    name: cache
    needs: [build, rootfs, tests, clippy, jffs2-mount]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: nix
        uses: ./.github/actions/nix-build
        with:
          cache: true
          stores: nix-new-*

      - name: Join and prune
        id: joined
        run: |
          cp --recursive "$RUNNER_TEMP/nix/in/." "$RUNNER_TEMP/nix/cache/"
          # shellcheck disable=SC2016 # the ${n} is Nix's
          checks="$(nix eval --raw .#checks.x86_64-linux --apply 'c: builtins.concatStringsSep " " (map (n: ".#checks.x86_64-linux.${n}") (builtins.attrNames c))')"
          # shellcheck disable=SC2086 # one argument per check
          echo "key=nix-store-$(.github/actions/nix-build/store.sh prune "$RUNNER_TEMP/nix/cache" .#all $checks)" >> "$GITHUB_OUTPUT"
          du --summarize --human-readable "$RUNNER_TEMP/nix/cache"

      - if: steps.joined.outputs.key != steps.nix.outputs.cache-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix/cache
          key: ${{ steps.joined.outputs.key }}

  release:
    name: GitHub Release
    needs: [model, checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      # The images are named <X_Y_Z>_<MODEL>_firmware.eff after the version
      # they were built with: exactly the seven of the tag's version.
      - name: The tag names the version of every image
        working-directory: dist
        run: |
          version="$(echo "${GITHUB_REF_NAME#v}" | tr . _)"
          expected="$(printf '%s\n' "$version"_D{40,45,50,60,62,65,70}_firmware.eff)"
          test "$(printf '%s\n' * | LC_ALL=C sort)" = "$expected"

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.eff > SHA256SUMS && cat SHA256SUMS

      # Running the job again replaces the files of the release it made.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.eff dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.eff dist/SHA256SUMS --verify-tag --generate-notes
          fi

  # Last, because a version on crates.io cannot be replaced: everything
  # before it can be run again.  Running this job again after it has
  # published does nothing.
  publish:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable

      # The SDK has the firmware's version.
      - name: The tag names the SDK's version
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "dphone-app-sdk") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Whether crates.io has this version already
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user-agent 'open-dphone-ci' "https://crates.io/api/v1/crates/dphone-app-sdk/$VERSION")"
          case "$status" in
            200) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "yes=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status" >&2; exit 1 ;;
          esac

      # Exchanges the job's OIDC token for a short-lived crates.io token;
      # the crate's trusted publisher is configured on crates.io.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.yes == 'false'

      - name: Publish
        if: steps.published.outputs.yes == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p dphone-app-sdk
