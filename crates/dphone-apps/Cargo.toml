[package]
name = "dphone-apps"
description = "Open DPhone: WebAssembly app runtime, host API, packages, and the app manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Compile WebAssembly to Pulley bytecode (Cranelift): what installs an app
# package.  The phone binary has it (a check in `crates/dphone` fails the
# build of one that does not), as do the build host's `dphone-apps-build`,
# which precompiles the built-in apps, and the host tests.
compile = ["wasmtime/cranelift", "wasmtime/pulley"]
# The host tool that componentizes, precompiles, and packs apps.
build-tool = ["compile", "cargo-dphone-app/tool", "cli"]
# The command lines of this crate's programs.
cli = ["dep:clap"]
# Fake view and services for tests.
test-util = []
# `UiShell`: the adapter from the phone UI toolkit to this crate's `Shell`.
ui = ["dep:dphone-ui"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
dphone-state = { path = "../dphone-state" }
dphone-ui = { path = "../dphone-ui", optional = true }
getrandom = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "process", "thread"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "component-model", "std"] }
# The manifest an app file carries, read by the code the tool app makers use.
cargo-dphone-app = { path = "../cargo-dphone-app", default-features = false }

[[bin]]
name = "dphone-apps-build"
required-features = ["build-tool"]

# Spike S1 measurement (see README): run on the phone or under qemu-arm.
[[bin]]
name = "dphone-apps-s1"
required-features = ["test-util", "cli"]

[dev-dependencies]
dphone-apps = { path = ".", features = ["build-tool", "test-util", "ui"] }
# The games' tests draw them with the phone UI on the simulator's display.
dphone-hal = { path = "../dphone-hal" }
dphone-ui = { path = "../dphone-ui" }
# The Light Up test makes the puzzles the app is expected to make, with the
# app's own game library (in the app's directory) built for this machine.
lightup-game = { path = "../../apps/lightup/game" }
png = "0.18"
