[package]
name = "dphone-dpma"
description = "Open DPhone: DPMA provisioning client and app-request transport on dpma-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = ["sip", "update", "https"]
# The provisioned-firmware installer over dphone-update.
update = ["dep:dphone-update", "dep:dphone-hal"]
# Downloads over https (rustls with the RustCrypto provider).
https = ["dep:rustls", "dep:rustls-rustcrypto"]
# Adapter that carries DPMA over dphone-sip's out-of-dialog MESSAGE.
sip = ["dep:dphone-sip"]

[dependencies]
dphone-state = { path = "../dphone-state" }
dphone-sip = { path = "../dphone-sip", optional = true }
dpma-proto = "0.3.4"
eff = { path = "../eff" }
dphone-update = { path = "../dphone-update", optional = true }
dphone-hal = { path = "../dphone-hal", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["std", "tls12"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
async-trait = "0.1"
log = "0.4"
md-5 = "0.10"
rsa = "0.9"
serde_json = "1"

[dev-dependencies]
dphone-hal = { path = "../dphone-hal" }
dphone-update = { path = "../dphone-update" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "test-util"] }
