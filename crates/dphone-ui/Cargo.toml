[package]
name = "dphone-ui"
description = "Open DPhone: UI toolkit, skins, native screens, and the app view API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dphone-state = { path = "../dphone-state" }
dphone-hal = { path = "../dphone-hal" }
log = "0.4"

[build-dependencies]
fontdue = "0.9"
resvg = { version = "0.48", default-features = false, features = ["text"] }

[dev-dependencies]
png = "0.18"
