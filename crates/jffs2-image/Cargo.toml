[package]
name = "jffs2-image"
description = "JFFS2 image writer and reader (little-endian, NAND layout without in-band cleanmarkers)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
test-inputs = { path = "../test-inputs" }
# The command lines of the examples.
clap = { version = "4", features = ["derive"] }
# Only for the VM mount test: unpacks the host kernel's `.ko.zst` modules.
ruzstd = "0.8"
