[package]
name = "dphone"
description = "Open DPhone: the one userspace binary (init role, main role, diagnostics)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "dphone"
path = "src/lib.rs"

[[bin]]
name = "dphone"
path = "src/main.rs"

[features]
default = ["web"]
# The web UI.  A feature only so that the rest can be built and tested while
# that crate is being reworked; every image carries it.
web = ["dep:dphone-web"]

[dependencies]
dphone-state = { path = "../dphone-state" }
dphone-config = { path = "../dphone-config" }
dphone-hal = { path = "../dphone-hal" }
dphone-bt = { path = "../dphone-bt" }
dphone-net = { path = "../dphone-net" }
dphone-update = { path = "../dphone-update" }
eff = { path = "../eff" }
dphone-sip = { path = "../dphone-sip" }
dphone-dpma = { path = "../dphone-dpma" }
async-trait = "0.1"
dphone-apps = { path = "../dphone-apps", features = ["ui"] }
dphone-web = { path = "../dphone-web", optional = true }
dphone-ui = { path = "../dphone-ui" }
serde_json = "1"
dphone-vpm = { path = "../dphone-vpm" }
dphone-media = { path = "../dphone-media" }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "process", "signal", "macros", "fs"] }
# Pinned: the last russh release whose cryptography is RustCrypto only.  Later
# releases require `ring` or `aws-lc-rs` (C and assembly) for their AEAD ciphers.
# The intent is to offer upstream a patch giving current russh a
# pure-RustCrypto cipher backend, and to unpin when that lands.
russh = { version = "=0.52.1", default-features = false }
russh-sftp = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
# App HTTP: TLS through the SIP crate's rustls policy (RustCrypto provider),
# and the two hashes of HTTP Digest authentication.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
md-5 = "0.10"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# The in-process DPMA server of dphone-dpma's tests (tests/provisioned_firmware.rs).
dpma-proto = "0.3.4"
tempfile = "3"
libc = "0.2"
rustls-pemfile = "2"
rustls-rustcrypto = "0.0.2-alpha"

# Runs in a private network namespace, which needs a single-threaded
# process: no test harness.
[[test]]
name = "paging"
harness = false

[[test]]
name = "expansion"
harness = false

[[test]]
name = "pcport"
harness = false

[[test]]
name = "staticaddr"
harness = false
