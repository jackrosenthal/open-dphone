[package]
name = "opendeskphone-web"
description = "Open Desk Phone: web server, Connect RPC services, and the embedded frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[features]
# Gates the generated Connect clients, which the firmware does not use.
client = []

[dependencies]
opendeskphone-state = { path = "../opendeskphone-state" }
opendeskphone-config = { path = "../opendeskphone-config" }
log = "0.4"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
buffa = { version = "0.9", default-features = false, features = ["std", "json"] }
futures-util = { version = "0.3", default-features = false }
tower-service = "0.3"
serde = "1"
serde_json = "1"
getrandom = "0.3"
miniz_oxide = "0.8"
crc32fast = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# "hazmat" is enabled by dpma-proto elsewhere in the workspace, and it adds a
# field to `Profile::Leaf`; enable it here too so the crate builds the same
# way alone and in the workspace.
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem", "std", "hazmat"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
# `/metrics`: the Prometheus project's own client library, used for its
# OpenMetrics text encoder (measured at about 12 KiB on the ARM target).
prometheus-client = "0.24"
# The web terminal: pseudo-terminals, and signals to the shell's process group.
libc = "0.2"

[build-dependencies]
protox = "0.10"
prost = "0.14"
connectrpc-build = "0.9"
buffa-codegen = "0.9"
miniz_oxide = "0.8"
brotli = { version = "8", default-features = false, features = ["std"] }

[dev-dependencies]
# The command lines of the examples.
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
opendeskphone-hal = { path = "../opendeskphone-hal" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
buffa = { version = "0.9", default-features = false, features = ["std", "json"] }
serde_json = "1"
getrandom = "0.3"
