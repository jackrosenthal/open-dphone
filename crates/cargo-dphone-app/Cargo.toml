[package]
name = "cargo-dphone-app"
description = "Builds and packs apps for Open DPhone, the open firmware for Digium D-series desk phones: `cargo dphone-app` turns an app crate written with dphone-app-sdk into the file the phone installs"
# The firmware's version: the tool of a release makes packages for that
# release's firmware, and is published with it and with the SDK.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["digium", "voip", "phone", "wasm", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "wasm", "embedded"]
# The test needs the SDK from this repository (a development dependency by
# path, which a published crate does not have).
exclude = ["/tests"]

[features]
default = ["tool"]
# The command `cargo dphone-app` and what only it needs: making a component
# of the module cargo builds.  The firmware uses this crate without it, to
# read the manifest in an app file, and has no dependencies from it.
tool = ["dep:wit-component", "dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
wit-component = { version = "0.263", optional = true }

[dev-dependencies]
# The writer of the manifest this crate reads (tests/sdk.rs).
dphone-app-sdk = { path = "../dphone-app-sdk" }

[[bin]]
name = "cargo-dphone-app"
required-features = ["tool"]
