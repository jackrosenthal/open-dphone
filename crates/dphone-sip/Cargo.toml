[package]
name = "dphone-sip"
description = "Open DPhone: SIP user agent (registration, calls, subscriptions, MESSAGE) on rsipstack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["tls"]
# SIP over TLS through rustls with the RustCrypto provider (no C).
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-rustcrypto", "dep:rustls-pki-types", "dep:rustls-pemfile", "dep:tokio-util", "dep:bytes"]

[dependencies]
dphone-state = { path = "../dphone-state" }
rsipstack = { version = "0.8.4", default-features = false, features = ["platform-tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
async-trait = "0.1"
log = "0.4"
md-5 = "0.10"
getrandom = "0.3"
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["codec"], optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pemfile = "2"
socket2 = "0.6"
