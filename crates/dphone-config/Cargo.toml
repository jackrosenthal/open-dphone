[package]
name = "dphone-config"
description = "Open DPhone configuration: nvdata files, XML layers, and the stock-compatible merge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
roxmltree = { version = "0.20", default-features = false, features = ["std"] }
md-5 = { version = "0.10", default-features = false }
# Protobuf text format for /nvdata/dphone_settings.txtpb.  The same runtime
# dphone-web already links, so it adds no crate to the firmware.
buffa = { version = "0.9", default-features = false, features = ["std", "text"] }
log = "0.4"

[build-dependencies]
protox = "0.10"
prost = "0.14"
buffa = { version = "0.9", default-features = false, features = ["std"] }
buffa-codegen = "0.9"

[dev-dependencies]
serde_json = "1"
