syntax = "proto3";

package opendeskphone.v1;

// Expansion modules (EXP100 and EXP150) attached to the PC port.
service ExpansionService {
  rpc GetExpansion(GetExpansionRequest) returns (GetExpansionResponse);
  rpc WatchExpansion(WatchExpansionRequest) returns (stream WatchExpansionResponse);
}

message ExpansionModule {
  // 0 for the module nearest the phone.
  uint32 node = 1;
  // The module's address on the private expansion network.
  string address = 2;
  // Version text from its discovery message.
  string version = 3;
  // The key page it shows, from 0.
  uint32 page = 4;
}

message ExpansionSnapshot {
  // The configuration enables expansion modules.
  bool enabled = 1;
  repeated ExpansionModule modules = 2;
  // Why the subsystem is not running; empty when fine.
  string error = 3;
}

message GetExpansionRequest {}

message GetExpansionResponse {
  ExpansionSnapshot snapshot = 1;
}

message WatchExpansionRequest {}

message WatchExpansionResponse {
  ExpansionSnapshot snapshot = 1;
}
