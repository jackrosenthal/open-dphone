syntax = "proto3";

package opendeskphone.v1;

service CallsService {
  rpc GetCalls(GetCallsRequest) returns (GetCallsResponse);
  rpc WatchCalls(WatchCallsRequest) returns (stream WatchCallsResponse);
  // Click-to-dial.
  rpc Dial(DialRequest) returns (DialResponse);
  rpc Answer(AnswerRequest) returns (AnswerResponse);
  rpc Hangup(HangupRequest) returns (HangupResponse);
  rpc Hold(HoldRequest) returns (HoldResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc SendDtmf(SendDtmfRequest) returns (SendDtmfResponse);
  rpc SetMute(SetMuteRequest) returns (SetMuteResponse);
  rpc SetDnd(SetDndRequest) returns (SetDndResponse);
  rpc SetForward(SetForwardRequest) returns (SetForwardResponse);
  rpc GetCallLog(GetCallLogRequest) returns (GetCallLogResponse);
  rpc ClearCallLog(ClearCallLogRequest) returns (ClearCallLogResponse);
}

enum CallDirection {
  CALL_DIRECTION_UNSPECIFIED = 0;
  CALL_DIRECTION_INCOMING = 1;
  CALL_DIRECTION_OUTGOING = 2;
}

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_DIALING = 1;
  CALL_STATE_PROCEEDING = 2;
  CALL_STATE_RINGBACK = 3;
  CALL_STATE_RINGING = 4;
  CALL_STATE_ACTIVE = 5;
  CALL_STATE_HELD = 6;
  CALL_STATE_TRANSFERRING = 7;
  CALL_STATE_ENDED = 8;
}

enum AudioPath {
  AUDIO_PATH_UNSPECIFIED = 0;
  AUDIO_PATH_NONE = 1;
  AUDIO_PATH_HANDSET = 2;
  AUDIO_PATH_HEADSET = 3;
  AUDIO_PATH_SPEAKER = 4;
}

// An audio codec.
enum Codec {
  CODEC_UNSPECIFIED = 0;
  // G.711 mu-law.
  CODEC_PCMU = 1;
  // G.711 A-law.
  CODEC_PCMA = 2;
  CODEC_G722 = 3;
  // G.726 at 32 kbit/s.
  CODEC_G726_32 = 4;
  CODEC_G729 = 5;
  CODEC_ILBC = 6;
  CODEC_OPUS = 7;
  // 16-bit linear PCM at 16 kHz.
  CODEC_L16 = 8;
  // 16-bit linear PCM at 32 kHz (stock's "L16-256").
  CODEC_L16_WIDE = 9;
}

// Why a call ended.
enum EndCause {
  // The call has not ended.
  END_CAUSE_UNSPECIFIED = 0;
  // This phone hung up.
  END_CAUSE_LOCAL_HANGUP = 1;
  // The other party hung up.
  END_CAUSE_REMOTE_HANGUP = 2;
  // This phone declined the incoming call.
  END_CAUSE_REJECTED = 3;
  // The caller gave up.
  END_CAUSE_CANCELED = 4;
  // The incoming call was answered elsewhere.
  END_CAUSE_ANSWERED_ELSEWHERE = 5;
  END_CAUSE_BUSY = 6;
  END_CAUSE_NO_ANSWER = 7;
  // The call was transferred.
  END_CAUSE_TRANSFERRED = 8;
  // A SIP failure response: `end_code` and `end_reason`.
  END_CAUSE_FAILED = 9;
  // A transport or media failure, which `end_reason` describes.
  END_CAUSE_ERROR = 10;
}

message Party {
  string name = 1;
  string number = 2;
  string uri = 3;
}

message Call {
  uint32 id = 1;
  uint32 account = 2;
  CallDirection direction = 3;
  CallState state = 4;
  Party remote = 5;
  uint64 started_unix = 6;
  // Seconds since answer; absent before answer.
  optional uint64 duration_secs = 7;
  // UNSPECIFIED until the codec is agreed.
  Codec codec = 8;
  bool srtp = 9;
  bool muted = 10;
  bool in_conference = 11;
  bool held_locally = 12;
  bool held_remotely = 13;
  // Why the call ended, when state is ENDED.
  EndCause end_cause = 14;
  bool focused = 15;
  uint32 rx_packets = 16;
  uint32 tx_packets = 17;
  uint32 rx_lost = 18;
  uint32 jitter_ms = 19;
  bool paging = 20;
  // END_CAUSE_FAILED: the SIP status code.
  uint32 end_code = 21;
  // END_CAUSE_FAILED: the SIP reason phrase.  END_CAUSE_ERROR: what
  // failed.
  string end_reason = 22;
}

// The state of the DSP that runs the audio.
enum DspState {
  DSP_STATE_UNSPECIFIED = 0;
  DSP_STATE_NOT_STARTED = 1;
  DSP_STATE_STARTING = 2;
  DSP_STATE_RUNNING = 3;
  // `dsp_detail` says why.
  DSP_STATE_FAILED = 4;
}

message AudioStatus {
  AudioPath path = 1;
  bool off_hook = 2;
  bool headset_mode = 3;
  bool muted = 4;
  uint32 handset_volume = 5;
  uint32 headset_volume = 6;
  uint32 speaker_volume = 7;
  uint32 ringer_volume = 8;
  bool ringing = 9;
  DspState dsp = 10;
  string dsp_detail = 11;
}

message FeatureStatus {
  bool dnd = 1;
  string forward_always = 2;
  string forward_busy = 3;
  string forward_no_answer = 4;
  uint32 forward_no_answer_secs = 5;
}

message MwiStatus {
  uint32 account = 1;
  bool waiting = 2;
  uint32 new_messages = 3;
  uint32 old_messages = 4;
}

message CallsSnapshot {
  repeated Call calls = 1;
  AudioStatus audio = 2;
  FeatureStatus features = 3;
  repeated MwiStatus mwi = 4;
  uint32 missed_unseen = 5;
}

enum CallLogKind {
  CALL_LOG_KIND_UNSPECIFIED = 0;
  CALL_LOG_KIND_MISSED = 1;
  CALL_LOG_KIND_RECEIVED = 2;
  CALL_LOG_KIND_PLACED = 3;
}

message CallLogEntry {
  uint64 id = 1;
  CallLogKind kind = 2;
  Party party = 3;
  uint32 account = 4;
  uint64 start_unix = 5;
  uint32 duration_secs = 6;
}

message GetCallsRequest {}

message GetCallsResponse {
  CallsSnapshot snapshot = 1;
}

message WatchCallsRequest {}

message WatchCallsResponse {
  CallsSnapshot snapshot = 1;
}

message DialRequest {
  string target = 1;
  optional uint32 account = 2;
  // UNSPECIFIED lets the phone choose (headset mode, off-hook, else speaker).
  AudioPath path = 3;
}

message DialResponse {
  uint32 call = 1;
}

message AnswerRequest {
  uint32 call = 1;
  AudioPath path = 2;
}

message AnswerResponse {}

message HangupRequest {
  uint32 call = 1;
}

message HangupResponse {}

message HoldRequest {
  uint32 call = 1;
}

message HoldResponse {}

message ResumeRequest {
  uint32 call = 1;
}

message ResumeResponse {}

message TransferRequest {
  uint32 call = 1;
  oneof to {
    // Blind transfer to a number or URI.
    string target = 2;
    // Attended transfer: connect to the party of this other call.
    uint32 consult_call = 3;
  }
}

message TransferResponse {}

message SendDtmfRequest {
  uint32 call = 1;
  string digits = 2;
}

message SendDtmfResponse {}

message SetMuteRequest {
  bool muted = 1;
}

message SetMuteResponse {}

message SetDndRequest {
  bool dnd = 1;
}

message SetDndResponse {}

// A call forwarding rule.
enum ForwardKind {
  FORWARD_KIND_UNSPECIFIED = 0;
  // Every call.
  FORWARD_KIND_ALWAYS = 1;
  // Calls that come while the phone is busy.
  FORWARD_KIND_BUSY = 2;
  // Calls not answered in `no_answer_secs`.
  FORWARD_KIND_NO_ANSWER = 3;
}

message SetForwardRequest {
  ForwardKind kind = 1;
  // Empty turns the rule off.
  string target = 2;
  uint32 no_answer_secs = 3;
}

message SetForwardResponse {}

message GetCallLogRequest {}

message GetCallLogResponse {
  repeated CallLogEntry entries = 1;
  uint32 missed_unseen = 2;
}

message ClearCallLogRequest {}

message ClearCallLogResponse {}
