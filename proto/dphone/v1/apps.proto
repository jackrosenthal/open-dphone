syntax = "proto3";

package dphone.v1;

import "dphone/settings/v1/settings.proto";
import "dphone/v1/config.proto";

// Phone apps (WebAssembly packages).  A package is uploaded with a plain
// authenticated HTTP POST to /upload/app, which answers with JSON carrying
// the upload_id used by InstallApp.
service AppsService {
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc WatchApps(WatchAppsRequest) returns (stream WatchAppsResponse);
  rpc LaunchApp(LaunchAppRequest) returns (LaunchAppResponse);
  rpc CloseApp(CloseAppRequest) returns (CloseAppResponse);
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse);
  rpc GetDisabledApps(GetDisabledAppsRequest) returns (GetDisabledAppsResponse);
  // Switches a built-in app on or off.
  rpc SetAppEnabled(SetAppEnabledRequest) returns (SetAppEnabledResponse);
}

// How an app runs.
enum AppKind {
  APP_KIND_UNSPECIFIED = 0;
  // Runs while it is on screen.
  APP_KIND_FOREGROUND = 1;
  // Starts with the phone and runs without being on screen.
  APP_KIND_BACKGROUND = 2;
}

message App {
  string name = 1;
  string id = 2;
  string display_name = 3;
  string description = 4;
  AppKind kind = 5;
  bool has_idle = 6;
  bool hidden = 7;
  bool builtin = 8;
  bool running = 9;
  bool foreground = 10;
  // A built-in app that is switched off: the phone does not list it and
  // cannot open it.
  bool disabled = 11;
}

// The built-in apps that are switched off (one of Open Desk Phone's own
// settings).
message DisabledApps {
  repeated dphone.settings.v1.App apps = 1;
  SettingSource source = 2;
  // The provisioning server fixed the list; it cannot be changed here.
  bool locked = 3;
}

message AppsSnapshot {
  repeated App apps = 1;
  string foreground = 2;
  string idle_app = 3;
}

message ListAppsRequest {}

message ListAppsResponse {
  AppsSnapshot snapshot = 1;
}

message WatchAppsRequest {}

message WatchAppsResponse {
  AppsSnapshot snapshot = 1;
}

message LaunchAppRequest {
  string name = 1;
}

message LaunchAppResponse {}

message CloseAppRequest {
  string name = 1;
}

message CloseAppResponse {}

message InstallAppRequest {
  string upload_id = 1;
}

message InstallAppResponse {}

message RemoveAppRequest {
  string name = 1;
}

message RemoveAppResponse {}

message GetDisabledAppsRequest {}

message GetDisabledAppsResponse {
  DisabledApps disabled_apps = 1;
}

message SetAppEnabledRequest {
  // A built-in app.
  string name = 1;
  bool enabled = 2;
}

message SetAppEnabledResponse {
  DisabledApps disabled_apps = 1;
}
