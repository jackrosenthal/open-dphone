syntax = "proto3";

package dphone.v1;

// Multicast paging.
service PagingService {
  rpc GetPaging(GetPagingRequest) returns (GetPagingResponse);
  rpc WatchPaging(WatchPagingRequest) returns (stream WatchPagingResponse);
  // Pages a group (one of PagingSnapshot.broadcasts).  A call in progress
  // is put on hold first.
  rpc StartPage(StartPageRequest) returns (StartPageResponse);
  // Stops paging, or stops listening to the page that is playing.
  rpc StopPage(StopPageRequest) returns (StopPageResponse);
}

// A multicast page group from the configuration.
message PageGroup {
  string id = 1;
  string name = 2;
  // Group address.
  string address = 3;
  uint32 port = 4;
}

enum PageActivity {
  PAGE_ACTIVITY_UNSPECIFIED = 0;
  PAGE_ACTIVITY_IDLE = 1;
  // A page is playing.
  PAGE_ACTIVITY_RECEIVING = 2;
  // A page arrived and was not played, because a call is up and the group
  // may not interrupt calls.
  PAGE_ACTIVITY_BLOCKED = 3;
  // This phone is paging.
  PAGE_ACTIVITY_SENDING = 4;
}

message PagingSnapshot {
  // Groups this phone listens to.
  repeated PageGroup listeners = 1;
  // Groups this phone can page.
  repeated PageGroup broadcasts = 2;
  PageActivity activity = 3;
  // The group of the activity: its ID and name.  Empty when idle.
  string active_group = 4;
  string active_name = 5;
  // Why the last page could not be sent or played; empty when fine.
  string error = 6;
}

message GetPagingRequest {}

message GetPagingResponse {
  PagingSnapshot snapshot = 1;
}

message WatchPagingRequest {}

message WatchPagingResponse {
  PagingSnapshot snapshot = 1;
}

message StartPageRequest {
  // PageGroup.id of a broadcast group.
  string id = 1;
}

message StartPageResponse {}

message StopPageRequest {}

message StopPageResponse {}
