syntax = "proto3";

package dphone.v1;

// A terminal on the phone: a root shell on a pseudo-terminal.
service ShellService {
  // Starts a shell and streams what it prints.  The first message names
  // the session; the last one, after the shell exits, carries its status.
  // Dropping the stream ends the shell.
  rpc OpenShell(OpenShellRequest) returns (stream OpenShellResponse);
  // Input for a session (keystrokes, pasted text).  The page also sends an
  // empty write every 25 seconds as a heartbeat: a shell not heard from for
  // 75 seconds is ended.
  rpc WriteShell(WriteShellRequest) returns (WriteShellResponse);
  rpc ResizeShell(ResizeShellRequest) returns (ResizeShellResponse);
  rpc CloseShell(CloseShellRequest) returns (CloseShellResponse);
}

message OpenShellRequest {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ShellStarted {
  string session_id = 1;
}

message ShellExited {
  // The exit code, when the shell exited by itself.
  int32 exit_code = 1;
  // The signal number, when a signal ended it; otherwise 0.
  int32 signal = 2;
  // The session ended for another reason (e.g., "idle"); otherwise empty.
  string reason = 3;
}

message OpenShellResponse {
  oneof event {
    ShellStarted started = 1;
    bytes output = 2;
    ShellExited exited = 3;
  }
}

message WriteShellRequest {
  string session_id = 1;
  bytes data = 2;
}

message WriteShellResponse {}

message ResizeShellRequest {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizeShellResponse {}

message CloseShellRequest {
  string session_id = 1;
}

message CloseShellResponse {}
