[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["apps"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/open-dphone/open-dphones"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
