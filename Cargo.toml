[workspace]
resolver = "3"
# Members are listed one by one, not by glob: a crate directory that is still
# being created (no manifest, or one that does not parse yet) must not break
# cargo for every other crate.  Add a crate here when it builds.
members = [
    "crates/app-sdk",
    "crates/boxpusher-game",
    "crates/dphone",
    "crates/dphone-apps",
    "crates/dphone-bt",
    "crates/dphone-config",
    "crates/dphone-hal",
    "crates/dphone-image",
    "crates/dphone-media",
    "crates/dphone-net",
    "crates/dphone-ui",
    "crates/dphone-web",
    "crates/dphone-sip",
    "crates/dphone-dpma",
    "crates/dphone-state",
    "crates/dphone-ui",
    "crates/dphone-web",
    "crates/dphone-update",
    "crates/dphone-vpm",
    "crates/dphone-update",
    "crates/dphone-web",
    "crates/eff",
    "crates/jffs2-image",
    "crates/lightup-game",
    "xtask",
]
exclude = ["apps"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/open-dphone/open-dphones"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwinding, not abort: a panic in one subsystem's thread or task must not
# take the SSH server down with it.
panic = "unwind"
strip = true

# The app interpreter's inner loop: measured markedly slower when built for
# size (see crates/dphone-apps/README.md).
[profile.release.package.pulley-interpreter]
opt-level = 3
