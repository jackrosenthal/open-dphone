# The Open DPhone documentation site, built with Zensical
# (https://zensical.org/docs/).  The pages are in docs/.
#
#   zensical build --strict    # writes site/; fails on a broken link
#   zensical serve             # preview at http://localhost:8000
#
# The configuration is written for Zensical 0.1.1.

[project]
site_name = "Open DPhone"
site_description = "Open firmware for the Digium D-series desk phones, and Open DPMA, the module for Asterisk that provisions them."
repo_url = "https://github.com/jackrosenthal/open-dphone"
repo_name = "jackrosenthal/open-dphone"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/site.css"]

# Every page of the site is listed here, by its path under docs/.  A page
# that is not listed is built, but no menu leads to it.  The first page of
# a section is the section's index.md, which is the page the section's tab
# opens.  To add a page, add its path to its section's list, in the order
# the pages are to be read.
nav = [
  { "Home" = "index.md" },
  { "Open DPMA" = [
    "open-dpma/index.md",
    "open-dpma/installation.md",
    "open-dpma/configuration.md",
    "open-dpma/open-dphone-options.md",
    "open-dpma/administration.md",
  ] },
  { "App SDK" = [
    "app-sdk/index.md",
    "app-sdk/examples.md",
    { "Tutorial" = [
      "app-sdk/tutorial/index.md",
      "app-sdk/tutorial/first-app.md",
      "app-sdk/tutorial/softkeys-and-state.md",
      "app-sdk/tutorial/persistent-storage.md",
      "app-sdk/tutorial/drawing.md",
      "app-sdk/tutorial/shared-data.md",
    ] },
    { "Reference" = [
      "app-sdk/reference/index.md",
      "app-sdk/reference/manifest.md",
      "app-sdk/reference/app-events.md",
      "app-sdk/reference/types.md",
      "app-sdk/reference/helpers.md",
      { "Interfaces" = [
        "app-sdk/reference/runtime.md",
        "app-sdk/reference/ui.md",
        "app-sdk/reference/canvas.md",
        "app-sdk/reference/timers.md",
        "app-sdk/reference/storage.md",
        "app-sdk/reference/pbx-storage.md",
        "app-sdk/reference/config.md",
        "app-sdk/reference/pbx.md",
        "app-sdk/reference/http.md",
        "app-sdk/reference/calls.md",
        "app-sdk/reference/presence.md",
        "app-sdk/reference/events.md",
        "app-sdk/reference/audio.md",
        "app-sdk/reference/l10n.md",
        "app-sdk/reference/hotdesk.md",
        "app-sdk/reference/diagnostics.md",
        "app-sdk/reference/lamps.md",
        "app-sdk/reference/input.md",
        "app-sdk/reference/alarms.md",
      ] },
    ] },
  ] },
  { "Dev Guide" = [
    "dev-guide/index.md",
    "dev-guide/building.md",
    "dev-guide/simulator.md",
    "dev-guide/ssh-and-serial-console.md",
    "dev-guide/test-builds.md",
    "dev-guide/firmware-updates.md",
    "dev-guide/dphone-command.md",
    "dev-guide/diagnostics.md",
    "dev-guide/troubleshooting.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/phone"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
