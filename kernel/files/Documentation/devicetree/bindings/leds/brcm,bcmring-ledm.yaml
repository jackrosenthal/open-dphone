# Binding draft.  Passes dt_binding_check apart from the missing "maintainers" entry.
%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/brcm,bcmring-ledm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCMRING (BCM11107 family) LED matrix controller

description:
  Self-refreshing LED matrix controller ("LEDM"), at most 6 rows by 12
  columns, on/off per lamp.  Only the parallel mode used by the Digium
  boards is described; there row r is pad GPIO 16 + r and column c is pad
  GPIO c, both on mux function 5.  The names of the timing properties are
  the names the vendor driver prints; their units are not known.

properties:
  compatible:
    const: brcm,bcmring-ledm

  reg:
    maxItems: 1

  clocks:
    items:
      - description: LED bus-interface gate (chip control BusIntfClock bit 16)
      - description: LED clock (vendor "LED_PWM", chip control LEDClock)

  clock-names:
    items:
      - const: bus
      - const: led

  "#address-cells":
    const: 2

  "#size-cells":
    const: 0

  brcm,scan-rows:
    description: Number of matrix rows the controller scans.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 6
    default: 5

  brcm,scan-columns:
    description: Number of matrix columns the controller scans.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 12
    default: 8

  brcm,clk-div:
    description: Clock divider field of the control register (vendor name "clkdiv"); unit not known.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 3
    default: 2

  brcm,res-div:
    description: Resolution divider field (vendor name "resdiv"); unit not known.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    default: 100

  brcm,on-time:
    description: Lamp on-time field (vendor name "ontime"); unit not known.
    $ref: /schemas/types.yaml#/definitions/uint32

  brcm,guard-time:
    description: Guard time between rows (vendor name "guardtime"); unit not known.
    $ref: /schemas/types.yaml#/definitions/uint32

patternProperties:
  "^led@[0-5],([0-9]|1[01])$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: Hardware row and column, both counted from zero.
        maxItems: 1

    required:
      - reg

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>
    led-controller@80002000 {
        compatible = "brcm,bcmring-ledm";
        reg = <0x80002000 0x40>;
        clocks = <&chipc 48>, <&chipc 17>; /* BUSIF_LED, LED */
        clock-names = "bus", "led";
        #address-cells = <2>;
        #size-cells = <0>;
        brcm,on-time = <256>;
        brcm,guard-time = <100>;

        led@0,2 {
            reg = <0 2>;
            color = <LED_COLOR_ID_GREEN>;
            function = LED_FUNCTION_MAIL;
        };
    };
