# SKETCH -- not validated with dt-schema, not submitted anywhere.
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/brcm,bcm11107-apm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCMRING (BCM11107 family) APM analog audio front end

description: |
  On-chip voice codec of the BCM11107 family (BCM11109, BCM11170, BCM11188,
  BCM11189).  Two full-duplex mono channels; each has an ADC with a two-way
  microphone selector (A/B) and a DAC with two output drivers (A/B).  16-bit
  samples move through four FIFOs serviced by the SoC DesignWare DMA
  controller.

  DAI 0 is channel 0, DAI 1 is channel 1.  Pin widgets exposed for
  audio-routing: "CH0 MIC A", "CH0 MIC B", "CH1 MIC A", "CH1 MIC B",
  "CH0 OUT A", "CH0 OUT B", "CH1 OUT A", "CH1 OUT B", and the supplies
  "CH0 MICBIAS", "CH1 MICBIAS".

  Each channel's microphone selector follows the routing: input B is
  selected while a live microphone is routed to the channel's "MIC B" pin,
  input A otherwise.

  Which transducer hangs off which pin is board wiring and belongs in the
  sound card node (e.g., digium,bcmring-phone-audio), not here.

properties:
  compatible:
    items:
      - enum:
          - brcm,bcm11109-apm
          - brcm,bcm11170-apm
          - brcm,bcm11188-apm
          - brcm,bcm11189-apm
      - const: brcm,bcm11107-apm

  reg:
    items:
      - description: control registers (0x600 bytes; the SoC PCM/TDM block
          follows directly at +0x600 and is a separate device)
      - description: channel 0 capture FIFO
      - description: channel 0 playback FIFO
      - description: channel 1 capture FIFO
      - description: channel 1 playback FIFO

  reg-names:
    items:
      - const: core
      - const: rx0
      - const: tx0
      - const: rx1
      - const: tx1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: 100 MHz block clock (vendor name APM100)
      - description: its 200 MHz parent (vendor name APM200), optional

    minItems: 1

  clock-names:
    items:
      - const: apm100
      - const: apm200
    minItems: 1

  dmas:
    maxItems: 4

  dma-names:
    items:
      - const: rx0
      - const: tx0
      - const: rx1
      - const: tx1

  resets:
    items:
      - description: APM block reset
      - description: second APM reset bit (the vendor releases both together)

  brcm,chipc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Chip-control node.  The driver sets the audio clock/channel enables
      (offset 0x7c), which have no clock or reset abstraction, through its
      regmap.

  "#sound-dai-cells":
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names
  - "#sound-dai-cells"

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/brcm,bcmring-chipc.h>

    apm: audio-codec@30600000 {
        compatible = "brcm,bcm11189-apm", "brcm,bcm11107-apm";
        reg = <0x30600000 0x600>,
              <0x30670000 0x4>, <0x30680000 0x4>,
              <0x30690000 0x4>, <0x306a0000 0x4>;
        reg-names = "core", "rx0", "tx0", "rx1", "tx1";
        interrupts = <28>;
        clocks = <&chipc BCMRING_CLK_APM100>, <&chipc BCMRING_CLK_APM>;
        clock-names = "apm100", "apm200";
        /* request line, memory master, peripheral master, channel mask */
        dmas = <&dma0 2 0 1 0x08>, <&dma0 3 0 1 0x04>,
               <&dma0 4 0 1 0x20>, <&dma0 5 0 1 0x10>;
        dma-names = "rx0", "tx0", "rx1", "tx1";
        resets = <&chipc BCMRING_RST_APM>, <&chipc BCMRING_RST_APM2>;
        brcm,chipc = <&chipc>;
        #sound-dai-cells = <1>;
    };
