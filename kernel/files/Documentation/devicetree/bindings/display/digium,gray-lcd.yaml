%YAML 1.2
---
$id: http://devicetree.org/schemas/display/digium,gray-lcd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Digium D40/D45/D50/D70 grayscale SPI LCD assemblies

# SKETCH.  Not run through dt_binding_check.  The "digium" vendor prefix is
# not in vendor-prefixes.yaml and would have to be added.

description: |
  The Digium (later Sangoma) D40, D45, and D50 desk phones have one
  240x120 four-level grayscale LCD on an SPI bus.  The D70 has a 320x160
  panel of the same kind plus a 113x357 side display behind a second chip
  select.  On the D70 both panels share the data/command line, so they are
  described as one device with two chip selects.

  The controller ICs are not identified with certainty.  The main panels
  use a command set and pixel packing that match the Sitronix ST7586S; the
  side display's command set resembles the UltraChip UC16xx family.  The
  compatibles therefore name the assemblies, not controllers.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - if:
      properties:
        compatible:
          const: digium,d70-lcd
    then:
      properties:
        reg:
          minItems: 2
        reset-gpios:
          minItems: 2
    else:
      properties:
        reg:
          maxItems: 1
        reset-gpios:
          maxItems: 1
        dss-backlight-enable-gpios: false
        dss-backlight-level-gpios: false

properties:
  compatible:
    enum:
      - digium,d40-lcd   # D40, D45, D50: 240x120 main panel
      - digium,d70-lcd   # D70: 320x160 main panel and 113x357 side display

  reg:
    minItems: 1
    items:
      - description: chip select of the main panel
      - description: chip select of the side display

  spi-max-frequency:
    maximum: 10000000

  dc-gpios:
    maxItems: 1
    description:
      Data/command select, high for pixel data and main-panel command
      parameters.  Shared by both panels on the D70.

  reset-gpios:
    minItems: 1
    items:
      - description: main panel reset
      - description: side display reset

  backlight:
    description: Backlight of the main panel.

  dss-backlight-enable-gpios:
    maxItems: 1
    description: Switches the side display backlight on.

  dss-backlight-level-gpios:
    minItems: 1
    maxItems: 8
    description:
      Binary-weighted brightness lines of the side display backlight, least
      significant bit first.

required:
  - compatible
  - reg
  - dc-gpios
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        display@0 {
            compatible = "digium,d70-lcd";
            reg = <0>, <1>;
            spi-max-frequency = <10000000>;
            dc-gpios = <&gpio0 22 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&gpio1 10 GPIO_ACTIVE_LOW>,
                          <&gpio1 1 GPIO_ACTIVE_LOW>;
            backlight = <&backlight>;
            dss-backlight-enable-gpios = <&gpio0 13 GPIO_ACTIVE_LOW>;
            dss-backlight-level-gpios = <&gpio0 8 GPIO_ACTIVE_LOW>,
                                        <&gpio0 26 GPIO_ACTIVE_LOW>,
                                        <&gpio0 27 GPIO_ACTIVE_LOW>,
                                        <&gpio0 28 GPIO_ACTIVE_LOW>,
                                        <&gpio0 29 GPIO_ACTIVE_LOW>;
        };
    };
...
