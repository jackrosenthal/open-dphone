[workspace]
resolver = "3"
members = ["contacts", "voicemail", "status", "parking", "queues", "hotdesking", "calendar", "diagnostics", "desksparrow", "boxpusher", "lightup"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
app-sdk = { path = "../crates/app-sdk" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The Light Up generator works for seconds on the phone: speed before size.
[profile.release.package.lightup-game]
opt-level = 3
