[workspace]
resolver = "3"
members = ["contacts", "voicemail", "status", "parking", "queues", "hotdesking", "calendar", "diagnostics"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
app-sdk = { path = "../crates/app-sdk" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
